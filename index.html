<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>FLC LAB - Laboratorio de Creación</title>
    <meta name="description" content="Plataforma de gestión de contenidos, eventos y colaboraciones para el laboratorio creativo del IES Fernando Lázaro Carreter." />
    <meta property="og:title" content="FLC LAB - Laboratorio de Creación" />
    <meta property="og:description" content="Plataforma de gestión de contenidos, eventos y colaboraciones para el laboratorio creativo del IES Fernando Lázaro Carreter." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Cabinet+Grotesk:wght@800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0B0F19] text-slate-100 antialiased selection:bg-amber-400 selection:text-black">
    <div id="root">
      <div id="app-loading" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0B0F19; color: #F1F5F9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;">
        <div style="width: 52px; height: 52px; border-radius: 14px; background: #F59E0B; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; font-weight: 900; font-size: 22px; color: #0B0F19; box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4);">FLC</div>
        <div style="font-size: 20px; font-weight: 900; letter-spacing: -0.02em; margin-bottom: 8px; color: #FFFFFF;">FLC LAB</div>
        <div style="font-size: 13px; color: #94A3B8; max-width: 280px; line-height: 1.5; margin-bottom: 24px;">Laboratorio de Creación<br/>IES Fernando Lázaro Carreter</div>
        <div style="display: flex; gap: 6px; align-items: center;">
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #F59E0B; animation: pulse 1.2s infinite ease-in-out;"></div>
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #F59E0B; animation: pulse 1.2s infinite ease-in-out; animation-delay: 0.2s;"></div>
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #F59E0B; animation: pulse 1.2s infinite ease-in-out; animation-delay: 0.4s;"></div>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('app-loading');
        if (el) {
          el.innerHTML = '<div style="background:#1E293B; border:2px solid #EF4444; padding:20px; border-radius:16px; max-width:92%; margin:auto; text-align:left; box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">' +
            '<div style="font-weight:900; color:#F87171; font-size:16px; margin-bottom:8px;">Aviso de inicialización</div>' +
            '<div style="font-size:12px; color:#CBD5E1; margin-bottom:12px;">Se ha producido un error al cargar los módulos en este navegador:</div>' +
            '<div style="font-family:monospace; font-size:11px; color:#FCA5A5; background:#0F172A; padding:10px; border-radius:8px; word-break:break-all; max-height:160px; overflow-y:auto;">' + (e.message || e.error || 'Error de script') + '</div>' +
            '<div style="margin-top:16px; display:flex; gap:10px;">' +
            '<button onclick="location.reload()" style="background:#F59E0B; color:#0B0F19; border:none; padding:10px 18px; border-radius:10px; font-weight:900; font-size:12px; cursor:pointer;">Reintentar</button>' +
            '</div></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
